name: Build and Publish THOOP Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Show release source
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          git status --short
          git show --stat --oneline --decorate HEAD

      - name: Validate Kotlin compilation
        working-directory: android
        run: ./gradlew :app:compileFullDebugKotlin --no-daemon

      - name: Run Full Debug unit tests
        working-directory: android
        run: ./gradlew :app:testFullDebugUnitTest --no-daemon

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Worker regression tests
        working-directory: cloud-coach
        run: node --test

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-debug-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn

      - name: Build Full Debug APK
        working-directory: android
        run: ./gradlew :app:assembleFullDebug --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$(find android/app/build/outputs/apk -type f -name '*.apk' -path '*/full/debug/*' | head -n 1)"

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "Full Debug APK was not found."
            find android/app/build/outputs/apk -type f || true
            exit 1
          fi

          mkdir -p release-assets

          APK_NAME="THOOP-${GITHUB_REF_NAME}-full-debug.apk"
          cp "$APK_SOURCE" "release-assets/$APK_NAME"

          (
            cd release-assets
            sha256sum "$APK_NAME" > SHA256SUMS.txt
          )

          {
            echo "THOOP automated release"
            echo
            echo "Tag: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "APK variant: Full Debug"
          } > release-assets/release-info.txt

          {
            echo "## THOOP $GITHUB_REF_NAME"
            echo
            echo "Automated release built from the tagged source."
            echo
            echo "### Included"
            echo
            echo "- Android Full Debug build from the exact tagged source"
            echo "- Complete Android unit suite and Worker regression tests"
            echo "- See the source commit and release documentation for feature changes"
            echo
            echo "### Validation"
            echo
            echo "- Kotlin compilation passed"
            echo "- Complete Full Debug unit suite passed"
            echo "- Worker tests passed"
            echo "- Full Debug APK assembled successfully"
            echo "- SHA-256 checksum included"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
          } > release-assets/RELEASE_NOTES.md

          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Retain an owner-published release and its matching signing certificate.
          # A generic CI debug key must never overwrite an installed-app update artifact.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Existing release retained; validation reports were uploaded separately."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/THOOP-${GITHUB_REF_NAME}-full-debug.apk" \
            "release-assets/SHA256SUMS.txt" \
            "release-assets/release-info.txt" \
            --verify-tag \
            --draft --prerelease --latest=false \
            --title "THOOP ${GITHUB_REF_NAME}" \
            --notes-file "release-assets/RELEASE_NOTES.md"
