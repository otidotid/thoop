name: Build and Publish THOOP Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Show release source
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          git status --short
          git show --stat --oneline --decorate HEAD

      - name: Validate Kotlin compilation
        working-directory: android
        run: ./gradlew :app:compileFullDebugKotlin --no-daemon

      - name: Run Full Debug unit tests
        working-directory: android
        run: ./gradlew :app:testFullDebugUnitTest --no-daemon

      - name: Build Full Debug APK
        working-directory: android
        run: ./gradlew :app:assembleFullDebug --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$(find android/app/build/outputs/apk -type f -name '*.apk' -path '*/full/debug/*' | head -n 1)"

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "Full Debug APK was not found."
            find android/app/build/outputs/apk -type f || true
            exit 1
          fi

          mkdir -p release-assets

          APK_NAME="THOOP-${GITHUB_REF_NAME}-full-debug.apk"
          cp "$APK_SOURCE" "release-assets/$APK_NAME"

          (
            cd release-assets
            sha256sum "$APK_NAME" > SHA256SUMS.txt
          )

          {
            echo "THOOP automated release"
            echo
            echo "Tag: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "APK variant: Full Debug"
          } > release-assets/release-info.txt

          {
            echo "## THOOP $GITHUB_REF_NAME"
            echo
            echo "Automated release built from the tagged source."
            echo
            echo "### Included"
            echo
            echo "- Current-day Calories repair"
            echo "- Uses raw heart-rate data and the existing Calories formula"
            echo "- Updates only the missing current-day active-calorie value"
            echo "- Preserves Sleep, Recovery, HRV, Strain, Steps, and historical metrics"
            echo
            echo "### Validation"
            echo
            echo "- Kotlin compilation passed"
            echo "- Full Debug unit tests passed"
            echo "- Full Debug APK assembled successfully"
            echo "- SHA-256 checksum included"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
          } > release-assets/RELEASE_NOTES.md

          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/THOOP-${GITHUB_REF_NAME}-full-debug.apk" \
            "release-assets/SHA256SUMS.txt" \
            "release-assets/release-info.txt" \
            --verify-tag \
            --title "THOOP ${GITHUB_REF_NAME}" \
            --notes-file "release-assets/RELEASE_NOTES.md"
