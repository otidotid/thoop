# Isolated verification of Android keyboard window-resize behavior.
# Never publishes a GitHub Release, never modifies production, no secrets in CI.
name: THOOP Coach IME Resize Verification

on:
  push:
    branches: [fix/coach-keyboard-adjust-resize]
    paths:
      - '.github/workflows/coach-ime-verify.yml'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/build.gradle.kts'
      - 'android/app/src/androidTest/**'
      - '.github/scripts/test-coach-ime-emulator.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build APK and unit tests
        env:
          THOOP_CLOUD_COACH_URL: https://thoop-cloud-coach.anandhito-prakoso.workers.dev
        run: |
          set -euo pipefail
          bash ./gradlew assembleFullDebug testFullDebugUnitTest
      - name: Verify merged Android manifest uses adjustResize
        run: |
          set -euo pipefail
          grep -q 'android:windowSoftInputMode="adjustResize"' app/src/main/AndroidManifest.xml
          MERGED=$(find app/build/intermediates -path '*fullDebug*' -name AndroidManifest.xml -print -quit)
          echo "Merged manifest: $MERGED"
          test -n "$MERGED"
          grep -q 'adjustResize' "$MERGED"
      - name: Upload verification APK for local re-signing with original THOOP key
        uses: actions/upload-artifact@v4
        with:
          name: THOOP-Coach-IME-Resize-Build561-REQUIRES-LOCAL-SIGNING
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator-geometry:
    # Run alongside compile/unit tests, not sequentially, to shorten verification.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Enable Linux KVM for Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify actual Compose geometry with keyboard visible
        uses: reactivecircus/android-emulator-runner@v2
        env:
          THOOP_CLOUD_COACH_URL: https://thoop-cloud-coach.anandhito-prakoso.workers.dev
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/test-coach-ime-emulator.sh
      - name: Upload screenshot and measured keyboard gap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-ime-emulator-evidence
          path: |
            coach-ime-open.png
            coach-ime-measurements.txt
            android/app/build/outputs/androidTest-results/connected/**
          retention-days: 7
