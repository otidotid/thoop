# Compile-and-test verification for the Android app.
#
# Debug build only, with unit tests. There is intentionally no signing config,
# no keystore, no secrets, and no artifact publishing here: release APKs are
# built and signed by hand. A debug build falls back to the Android debug key
# automatically, so this job needs nothing from the repository owner to pass.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # The twin-drift guards read the SWIFT side's fixtures on purpose — DecoderOracleTest compares
      # against Packages/.../decoder_oracle.json to catch a one-sided edit, and the schema/protocol
      # oracles work the same way. Without these, editing the Swift copy alone leaves the very test
      # written to catch that from ever running. Keep this list in step with what the tests read.
      - 'Packages/WhoopProtocol/Sources/WhoopProtocol/Resources/**'
      - 'Packages/WhoopProtocol/Tests/WhoopProtocolTests/Resources/**'
      - 'Packages/WhoopStore/Tests/WhoopStoreTests/Resources/**'
      - 'Strand/Resources/Localizable.xcstrings'
  push:
    branches: [main, fix/coach-ime-dock-preview7]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # The twin-drift guards read the SWIFT side's fixtures on purpose — DecoderOracleTest compares
      # against Packages/.../decoder_oracle.json to catch a one-sided edit, and the schema/protocol
      # oracles work the same way. Without these, editing the Swift copy alone leaves the very test
      # written to catch that from ever running. Keep this list in step with what the tests read.
      - 'Packages/WhoopProtocol/Sources/WhoopProtocol/Resources/**'
      - 'Packages/WhoopProtocol/Tests/WhoopProtocolTests/Resources/**'
      - 'Packages/WhoopStore/Tests/WhoopStoreTests/Resources/**'
      - 'Strand/Resources/Localizable.xcstrings'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Deliberately nonfunctional HTTPS endpoint: this build is for keyboard layout
      # testing on a second phone only. It cannot call a live AI or spend quota.
      - name: Build debug APK
        env:
          THOOP_CLOUD_COACH_URL: https://example.invalid
        run: bash ./gradlew assembleFullDebug

      - name: Upload Coach keyboard test APK (patch branch only)
        if: github.ref == 'refs/heads/fix/coach-ime-dock-preview7'
        uses: actions/upload-artifact@v4
        with:
          name: THOOP-Coach-Keyboard-Fix-Preview7
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Run unit tests
        run: bash ./gradlew testFullDebugUnitTest
