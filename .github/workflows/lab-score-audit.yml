name: THOOP Lab Score Audit

on:
  push:
    branches:
      - feature/lab-marks-ai-integration-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-score-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile full debug APK
        run: bash ./gradlew assembleFullDebug
      - name: All full-debug JVM tests
        run: bash ./gradlew testFullDebugUnitTest
