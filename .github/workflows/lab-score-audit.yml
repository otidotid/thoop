name: THOOP Lab Score Audit

on:
  push:
    branches:
      - feature/lab-marks-ai-integration-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-score-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile full debug APK
        run: bash ./gradlew assembleFullDebug --no-build-cache --rerun-tasks
      - name: Focused lab and score regression tests
        run: >-
          bash ./gradlew testFullDebugUnitTest
          --tests 'com.noop.ai.LabInterpretation*Test'
          --tests 'com.noop.ai.AiCoachContextTest'
          --tests 'com.noop.analytics.*Lab*Test'
          --tests 'com.noop.analytics.WeeklyLabSnapshotTest'
          --tests 'com.noop.analytics.FitnessAge*Test'
          --tests 'com.noop.analytics.Vo2*Test'
          --tests 'com.noop.analytics.VitalityEngineTest'
          --tests 'com.noop.analytics.TotalCaloriesEngineTest'
          --tests 'com.noop.analytics.DayCaloriesTest'
          --tests 'com.noop.analytics.Recovery*Test'
      - name: All full-debug JVM tests
        id: full-tests
        if: ${{ !cancelled() }}
        run: bash ./gradlew testFullDebugUnitTest
      - name: Publish build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-score-audit-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Coach and optional lab interpretation regression tests
        working-directory: cloud-coach
        run: node --test


